name: Turso Database Automated Backup

on:
  schedule:
    # Exécution automatique tous les dimanches à minuit UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  backup:
    name: Backup Turso SQLite DB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Turso CLI
        run: |
          curl -sL https://get.tur.so/install.sh | bash
          echo "$HOME/.turso" >> $GITHUB_PATH

      - name: Export Turso Database Dump
        env:
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
          TURSO_ORG: ${{ secrets.TURSO_ORG }}
          TURSO_DB_NAME: ${{ secrets.TURSO_DB_NAME || 'asap-airsoft-db' }}
        run: |
          if [ -z "$TURSO_API_TOKEN" ]; then
            echo "::warning::TURSO_API_TOKEN non défini dans les secrets GitHub."
            exit 0
          fi
          
          TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')
          mkdir -p backups
          turso db dump $TURSO_DB_NAME > "backups/turso_backup_${TIMESTAMP}.sql"

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: turso-sqlite-backup-${{ github.run_id }}
          path: backups/
          retention-days: 30
